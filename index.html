<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="card">
            <h3>Home</h3>
            <div id="home-score" class="score">0</div>
            <div class="btn-group"> 
                <button onclick="addHomePoints(+1)">+1</button>
                <button onclick="addHomePoints(+2)">+2</button>
                <button onclick="addHomePoints(+3)">+3</button>
            </div>
        </div>

        <div class="card">
            <h3>Away</h3>
            <div id="guest-score" class="score">0</div>
            <div class="btn-group">
                <button onclick="addGuestPoints(+1)">+1</button>
                <button onclick="addGuestPoints(+2)">+2</button>
                <button onclick="addGuestPoints(+3)">+3</button>
            </div>
        </div>
    </div>

    <div id="reset-btn" onclick="resetScore()">New Game</div>    
    <script src="index.js"></script>
</body>
</html>
